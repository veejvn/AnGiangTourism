<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaflet</title>

    <!-- Sử dụng CDN cho Bootstrap và Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <form th:action="/admin/login" th:object="${adminLoginView}" method="post">
        <div class = "form-group">
            <input type="email" th:field="*{email}" placeholder="Email">
            <label th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></label>
        </div>
        <div class = "form-group">
            <input type="password" th:field="*{password}" placeholder="Password">
            <label th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></label>
        </div>
        <input type="submit" value="Submit">
    </form>

<!-- Leaflet Map -->

<!-- Sử dụng CDN cho JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
