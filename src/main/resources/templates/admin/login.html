<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/main.css}">
<!--    <link rel="stylesheet" href="@{/css/main.css}"> &lt;!&ndash; Nếu bạn có file CSS &ndash;&gt;-->
</head>
<body>
<section class="ftco-section" style="height: inherit;">
    <div class="container ">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-wrap p-0" style="margin-top: 30%;">
                    <h3 class="mb-4 text-center">Đăng Nhập</h3>
                    <form th:action="@{/admin/login}" th:object="${adminLoginView}" method="post" class="signin-form">
                        <div class="form-group" style="margin-bottom: 5%;">
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Email" required="">
<!--                            <div class="text-danger" th:if="${email)}">-->
<!--                                <p th:text="${email}"> </p>-->
<!--                            </div>-->
                        </div>
                        <div class="form-group" style="margin-bottom: 5%;">
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Password"
                                   required="">
                        </div>
                        <div class="form-group">
                            <button type="submit" class="form-control btn btn-primary submit px-3">Sign In</button>
                        </div>
                        <div th:if="${param.error}" class="text-danger">
                            <p  th:text="${param.error}"></p>
                        </div>
<!--                        <div class="form-group">-->
<!--                            <p style="color: red;" th:if="${#fields.hasErrors('authentication')}" th:errors="*{authentication}"></p>-->
<!--                        </div>-->
                        <div class="form-group d-md-flex">
                            <div class="w-50">
                                <label class="checkbox-wrap checkbox-primary">Remember Me
                                    <input type="checkbox" checked="">
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
