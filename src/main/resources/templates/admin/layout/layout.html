<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">App Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/leaflet.css}">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div class="header w-full h-16 bg-white flex items-center px-4 fixed ml-2">
        Trang Quản Lý
    </div>
    <!-- Sidebar -->
    <div class="w-64 bg-white shadow-lg mt-16">
        <ul class="p-4">
            <!-- Links như đã thiết kế -->
            <li class="mb-4">
                <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'home' ? 'active' : ''}"
                   class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Trang Chủ</a>
            </li>
            <li class="mb-4">
                <a th:href="@{/}" th:classappend="${activePage == 'home' ? 'active' : ''}"
                   class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Xem Bản Đồ</a>
            </li>
            <li>
                <details class="group mb-4">
                    <summary class="flex justify-between items-center text-gray-700 p-2 rounded hover:bg-gray-200 cursor-pointer">
                        Place
                        <svg class="w-4 h-4 ml-2 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </summary>
                    <ul class="ml-4 mt-2 space-y-2">
                        <li><a th:href="@{/admin/place/create}" class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Tạo Mới</a></li>
                        <li><a th:href="@{/admin/place/list}" class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Danh Sách</a></li>
                    </ul>
                </details>
            </li>
            <li>
                <details class="group mb-4">
                    <summary class="flex justify-between items-center text-gray-700 p-2 rounded hover:bg-gray-200 cursor-pointer">
                        Category
                        <svg class="w-4 h-4 ml-2 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </summary>
                    <ul class="ml-4 mt-2 space-y-2">
                        <li><a th:href="@{/admin/category/create}" class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Tạo Mới</a></li>
                        <li><a th:href="@{/admin/category/list}" class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Danh Sách</a></li>
                    </ul>
                </details>
            </li>
            <li class="mb-4">
                <a th:href="@{/admin/logout}" class="block text-gray-700 p-2 rounded hover:bg-gray-200 transition">Đăng xuất</a>
            </li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 p-6 bg-gray-50 mt-16">
        <div layout:fragment="content"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script th:src="@{/js/leaflet.js}"></script>
<script>
    // Handle active link color
    const links = document.querySelectorAll('a'); // Lấy tất cả các thẻ <a>
    links.forEach(link => {
        link.addEventListener('click', (event) => {
            // Xóa lớp 'active' khỏi tất cả các liên kết
            links.forEach(link => link.classList.remove('active'));
            // Thêm lớp 'active' vào liên kết được nhấp
            event.currentTarget.classList.add('active');
        });
    });
</script>
</body>
</html>
