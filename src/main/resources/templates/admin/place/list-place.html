<!DOCTYPE html>
<html layout:decorate="admin/layout/layout.html" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Place</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-2xl font-bold my-4">Danh sách các Place</h1>
    <table class="min-w-full bg-white shadow-md rounded-lg overflow-hidden">
        <thead>
        <tr>
            <th class="py-2 px-4 border-b border-gray-300">STT</th>
            <th class="py-2 px-4 border-b border-gray-300">Tên</th>
            <th class="py-2 px-4 border-b border-gray-300">Mô tả</th>
            <th class="py-2 px-4 border-b border-gray-300">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <!-- Sử dụng vòng lặp th:each để duyệt qua danh sách các place -->
        <tr th:each="place : ${places}">
            <td class="py-2 px-4 border-b border-gray-300" th:text="${place.id}">1</td>
            <td class="py-2 px-4 border-b border-gray-300" th:text="${place.name}">Tên</td>
            <td class="py-2 px-4 border-b border-gray-300" th:text="${place.description}">Mô tả</td>
            <td class="py-2 px-4 border-b border-gray-300">
                <button class="bg-blue-500 text-white px-3 py-1 rounded">Chỉnh sửa</button>
                <a th:href="@{'/admin/place/delete/' + ${place.id}}" class="text-red-500 ml-2">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
