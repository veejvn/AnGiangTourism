<!DOCTYPE html>
<html layout:decorate="admin/layout/layout.html" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Place</title>
  <script>
    async function uploadImageAndSubmit(event) {
        event.preventDefault(); // Ngăn form submit mặc định

        const fileInput = document.querySelector('input[type="file"]');
        const file = fileInput.files[0];
        if (!file) return alert("Vui lòng chọn hình ảnh!");

        const formData = new FormData();
        formData.append("image", file);

        try {
            const response = await fetch('/upload/image', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const imageUrl = await response.text();
                document.getElementById('image').value = imageUrl; // Gán URL vào trường ẩn "image"

                // Sau khi upload thành công, submit form
                document.getElementById('createPlaceForm').submit();
            } else {
                alert("Upload thất bại!");
            }
        } catch (error) {
            alert("Có lỗi xảy ra khi upload ảnh.");
        }
    }
  </script>
  <style>
    .leaflet-control-zoom{
        display: none !important;
    }
  </style>
</head>
<body>
<div layout:fragment="content">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4 w-full">
        <div class="login-wrap p-0">
          <h3 class="mb-4 text-center text-2xl">Thêm địa danh mới</h3>
          <form id="createPlaceForm" class="signin-form d-flex" th:action="@{/admin/place/create}" th:object="${placeRequest}" method="post" enctype="multipart/form-data" onsubmit="uploadImageAndSubmit(event)">
          <!-- Thêm ID để truy cập form -->
            <div class="col-md-6 pr-3">
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="text" class="form-control" th:field="*{name}" placeholder="Tên địa danh" required="">
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="text" class="form-control" th:field="*{address}" placeholder="Địa chỉ" required="">
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="text" class="form-control" th:field="*{description}" placeholder="Mô tả địa danh" required="">
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="text" class="form-control" th:field="*{hotLine}" placeholder="Hotline" required="">
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="number" class="form-control" th:field="*{minPrice}" placeholder="min price" required="">
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="number" class="form-control" th:field="*{maxPrice}" placeholder="max price" required="">
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <select th:field="*{categoryId}" class="form-control" required>
                  <option value="" disabled selected>Chọn một loại dịch vụ</option>
                  <option th:each="category : ${categories}"
                          th:value="${category.id}"
                          th:text="${category.name}">
                  </option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom: 5%;">
                <input type="file" class="form-control" required>
                <input type="hidden" id="image" th:field="*{image}" name="image"> <!-- Trường ẩn để lưu URL ảnh -->
              </div>

              <div th:if="${successMessage}" class="text-green-500">
                <p th:text="${successMessage}"></p>
              </div>
              <div th:if="${errorMessage}" class="text-danger">
                <p  th:text="${errorMessage}"></p>
              </div>
            </div>
            <div class="col-md-6">
              <div id="map" style="height: 400px; margin-bottom: 20px;"></div>
              <div class="form-group d-flex mb-3">
                <div class="col-6 pr-2">
                  <input type="text" id="geometrylatt" th:field="*{latitude}" class="form-control" placeholder="Kinh độ" required>
                </div>
                <div class="col-6 pl-2">
                  <input type="text" id="geometrylong" th:field="*{longitude}" class="form-control" placeholder="Vĩ độ" required>
                </div>
              </div>
              <div class="form-group">
                <button type="submit" class="form-control btn btn-primary submit px-3">Thêm</button>
              </div>
            </div>


<!--            <div th:if="${not #lists.isEmpty(place.errors)}" class="text-danger">-->
<!--              <p th:text="${place.errors}"></p>-->
<!--            </div>-->
          </form>
        </div>
      </div>
    </div>
  </div>
  <script th:inline="javascript">
    $(document).ready(function() {
        var map = L.map('map').setView([10.68017547433677, 105.06905204028709], 13); // Tọa độ khởi đầu
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        var marker;
        map.on('click', function(e) {
            if (marker) {
                map.removeLayer(marker);
            }
            marker = L.marker(e.latlng).addTo(map);
            document.getElementById('geometrylatt').value = e.latlng.lat;
            document.getElementById('geometrylong').value =  e.latlng.lng;
        });
    });
  </script>
</div>
</body>
</html>
