<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaflet</title>

    <!-- Sử dụng CDN cho Bootstrap và Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thêm Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <!-- Thêm Bootstrap JavaScript và Popper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/leaflet.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        });
    </script>
</head>
<body class="bg-gray-100">
<header>
    <!-- Navbar Start -->
    <nav class="navbar flex items-center justify-between p-4 fixed top-0 left-0 right-0">
        <div class="container mx-auto flex items-center">
            <a th:href="@{/}" class="text-primary font-bold text-2xl flex items-center">
                <i class="fa fa-book mr-2"></i> AnGiangtourism
            </a>
            <div class="flex items-center ml-auto space-x-2">
                <button id="toggleBorder" class="btn bg-red-500 text-white p-1.5 rounded-lg hover:bg-red-600" data-bs-toggle="tooltip" data-bs-placement="top" title="Bật/tắt viền bản đồ">
                    <i class="fa-solid fa-vector-square"></i></span>
                </button>
                <input type="text" id="searchInput" class="input-search form-control max-w-xs border border-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500" placeholder="Nhập tên địa điểm">
                <button id="searchButton" data-bs-toggle="tooltip" title="Tìm kiếm" class="btn bg-blue-500 text-white p-1.5 rounded-lg hover:bg-blue-600">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="btn bg-red-500 text-white p-1.5 rounded-lg hover:bg-red-600" data-bs-toggle="tooltip" title="Thoát tìm kiếm">
                    <a th:href="@{/}"><i class="fa-solid fa-xmark"></i></a>
                </button>
                <button id="" class="btn bg-green-500 text-white p-1.5 rounded-lg hover:bg-green-600" data-bs-toggle="tooltip" data-bs-placement="top" title="Quản trị viên"
                        th:if="${#authentication.authenticated}">
                    <a th:href="@{/admin}"><i class="fa-solid fa-user-tie"></i></a>
                </button>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->
</header>

<!-- Sidebar Start -->
<button id="toggleSidebar" class="btn fixed top-1/4 text-white left-3 z-20 rounded-lg p-2" data-bs-toggle="tooltip" data-bs-placement="top" title="Tìm kiếm theo phạm vi">
    <i class="fa-solid fa-sliders"></i>
</button>

<div id="sidebar" class="z-index bg-white shadow-lg p-6 rounded-lg w-80 max-h-screen overflow-y-auto border border-gray-200">
    <!-- Nút đóng sidebar -->
    <button id="closeSidebar" class="flex items-center gap-2 text-gray-600 bg-gray-200 hover:bg-gray-300 px-3 py-2 rounded-lg transition" data-bs-toggle="tooltip" data-bs-placement="top" title="Đóng hộp thoại">
        <i class="fa-solid fa-times"></i>
        <span>Đóng</span>
    </button>

    <!-- Tiêu đề -->
    <h4 class="text-xl font-semibold text-gray-700 mt-6 mb-4">Tìm kiếm theo bán kính</h4>

    <!-- Dropdown cho Loại hình du lịch -->
    <div class="mb-6">
        <label for="categoryDropdown" class="block text-sm font-medium text-gray-700 mb-2" >Loại hình du lịch</label>
        <select id="categoryDropdown" class="w-full border-gray-300 rounded-lg p-2.5 text-gray-600 focus:outline-none focus:ring focus:ring-blue-300" data-bs-toggle="tooltip" data-bs-placement="top" title="Chọn loại hình du lịch">
            <option selected>Chọn loại hình</option>
            <th:block th:each="category : ${categories}">
                <option th:value="${category.id}" th:text="${category.name}">Category</option>
            </th:block>
        </select>
    </div>

    <!-- Ô nhập Tâm tìm kiếm -->
    <div class="mb-6">
        <label for="centerInput" class="block text-sm font-medium text-gray-700 mb-2">Tâm tìm kiếm</label>
        <div class="flex items-center gap-2">
            <input type="text" id="centerInput" class="flex-grow border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring focus:ring-blue-300" placeholder="Chọn tâm hoặc vị trí hiện tại">
            <button id="toggleLocationBtn" class="text-white bg-blue-500 hover:bg-blue-600 p-2 rounded-lg transition" data-bs-toggle="tooltip" title="Vị trí của bạn">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </div>
    </div>

    <!-- Dropdown cho Bán kính -->
    <div class="mb-6">
        <label for="radiusSelect" class="block text-sm font-medium text-gray-700 mb-2">Bán kính</label>
        <select id="radiusSelect" class="w-full border-gray-300 rounded-lg p-2.5 text-gray-600 focus:outline-none focus:ring focus:ring-blue-300" data-bs-toggle="tooltip" data-bs-placement="top" title="Chọn bán kính">
            <option value="1000">1 km</option>
            <option value="5000">5 km</option>
            <option value="10000">10 km</option>
            <option value="20000">20 km</option>
            <option value="50000">50 km</option>
        </select>
    </div>

    <!-- Nút Tìm kiếm -->
    <button id="submitSearch" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg text-lg font-semibold transition">Tìm kiếm</button>
</div>

<!-- Sidebar End -->

<!-- Leaflet Map -->
<div id="map" class="w-full h-screen"></div>

<!-- Sử dụng CDN cho JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/leaflet.js}"></script>
<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/locationInDB.js}"></script>
<script th:src="@{/js/searchByCategory.js}"></script>
<script th:src="@{/js/position.js}"></script>
<script>
    document.getElementById('toggleSidebar').addEventListener('click', function() {
        document.getElementById('sidebar').classList.add('show');
        document.getElementById('toggleSidebar').style.display = 'none';
    });

    document.getElementById('closeSidebar').addEventListener('click', function() {
        document.getElementById('sidebar').classList.remove('show');
        document.getElementById('toggleSidebar').style.display = 'block';
    });
</script>
</body>
</html>
