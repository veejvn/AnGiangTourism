<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaflet</title>

    <!-- Sử dụng CDN cho Bootstrap và Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/leaflet.css}">
</head>
<body>
<header>
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light sticky-top p-0 header">
        <a th:href="@{/}" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
            <h2 class="m-0 text-primary"><i class="fa fa-book me-3"></i>eLEARNING</h2>
        </a>
        <div class="search-container mb-3">
            <input type="text" id="searchInput" class="input-search" placeholder="Nhập tên địa điểm" />
            <button id="searchButton" class="submit-search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="close-search"><a th:href="@{/}"><i class="fa-solid fa-xmark"></i></a></button>

        </div>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <a th:href="@{/}" class="nav-item navbar-item nav-link active">Home</a>
                <a th:href="@{/about}" class="nav-item navbar-item nav-link">About</a>
                <a th:href="@{/courses}" class="nav-item navbar-item nav-link">Contact</a>
                <div class="nav-item navbar-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a>
                    <div class="dropdown-menu fade-down m-0">
                        <a th:href="@{/team}" class="dropdown-item">Our Team</a>
                        <a th:href="@{/testimonial}" class="dropdown-item">Testimonial</a>
                        <a th:href="@{/404}" class="dropdown-item">404 Page</a>
                    </div>
                </div>
                <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                   th:href="@{/admin/dashboard}" class="navbar-item nav-item nav-link">Admin
                </a>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->
</header>

<!-- Leaflet Map -->
<div id="map"></div>

<!-- Sử dụng CDN cho JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script th:src="@{/js/leaflet.js}"></script>
<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/locationInDB.js}"></script>
</body>
</html>
